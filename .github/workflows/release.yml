name: Release Flutter SDK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches pubspec.yaml
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          if [ "$PUBSPEC_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.VERSION }} does not match pubspec.yaml version=$PUBSPEC_VERSION"
            exit 1
          fi

      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Publish to pub.dev
        run: dart pub publish --force

      # Public release notes are reviewed and published by hand: create a DRAFT whose body is
      # the CHANGELOG section for this version (never an auto-generated commit list).
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v "$" {f=1; next} f && /^## / {exit} f' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || echo "refiner_flutter $VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
